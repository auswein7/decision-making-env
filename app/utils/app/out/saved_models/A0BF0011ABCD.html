    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "blue", "font": {"color": "black"}, "id": "A0", "label": "A0", "shape": "dot", "title": "Agent 0"}, {"color": "blue", "font": {"color": "black"}, "id": "A1", "label": "A1", "shape": "dot", "title": "Agent 1"}, {"color": "blue", "font": {"color": "black"}, "id": "A2", "label": "A2", "shape": "dot", "title": "Agent 2"}, {"color": "blue", "font": {"color": "black"}, "id": "A3", "label": "A3", "shape": "dot", "title": "Agent 3"}, {"color": "blue", "font": {"color": "black"}, "id": "A4", "label": "A4", "shape": "dot", "title": "Agent 4"}, {"color": "green", "font": {"color": "black"}, "id": "R5", "label": "R5", "shape": "square", "title": "Resource 5 (Val: 5)"}, {"color": "green", "font": {"color": "black"}, "id": "R6", "label": "R6", "shape": "square", "title": "Resource 6 (Val: 6)"}, {"color": "green", "font": {"color": "black"}, "id": "R7", "label": "R7", "shape": "square", "title": "Resource 7 (Val: 7)"}, {"color": "green", "font": {"color": "black"}, "id": "R8", "label": "R8", "shape": "square", "title": "Resource 8 (Val: 8)"}, {"color": "green", "font": {"color": "black"}, "id": "R9", "label": "R9", "shape": "square", "title": "Resource 9 (Val: 9)"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "A1", "to": "R9"}, {"arrows": "to", "from": "A2", "to": "R9"}, {"arrows": "to", "from": "A2", "to": "R5"}, {"arrows": "to", "from": "A3", "to": "R7"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
