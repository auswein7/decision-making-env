[DEFAULT]
# ---------- SYSTEM INITIALIZATION PARAMETERS ----------
num_trials=1
iterations_per_trial=10000
num_resources=40
num_agents=8
max_cover=2
resource_val_lb=5
resource_val_ub=30
agent_action_len_lb=3
agent_action_len_ub=4
agent_subset_len_lb=3
agent_subset_len_ub=4
load_from_config=False
# passing a comma separated list of algorithm names will run all sequentially
algorithm=approximate_best_response,logit_response
system_convergence_iter=500
batch_wake_up=False

# ---------- APPROXIMATE BEST RESPONSE PARAMETERS ----------
beta=0.5

# ---------- LOGIT RESPONSE PARAMETERS ----------
temperature=1.0

# ---------- GENETIC PARAMETERS ----------
population_size = 10000
mutation_rate = 0.33
tournament_k = 1000
num_parents = 2
generational_size = 0.95
k_crossover=1

# ---------- PARAMETER ANALYSIS SETTINGS ----------
# NOTE: True values trigger custom running configurations, only set one to True at a time
analyze_beta=True
analyze_temperature=False
trial_repetitions=10