[DEFAULT]
# ---------- SYSTEM INITIALIZATION PARAMETERS ----------
trial_repetitions=1
iterations_per_trial=6000
num_resources=1000
num_agents=100
max_cover=2
resource_val_lb=2
resource_val_ub=10
agent_action_len_lb=2
agent_action_len_ub=4
agent_subset_len_lb=2
agent_subset_len_ub=4
# passing a comma separated list of distribution names will run all sequentially
distribution=approximate_best_response
utility=marginal_contribution
system_convergence_iter=500
init_from_optimal=False
init_from_random=False

# ---------- APPROXIMATE BEST RESPONSE PARAMETERS ----------
beta=1.0

# ---------- LOGIT RESPONSE PARAMETERS ----------
temperature=0.0001

# ---------- GRAPH GENERATOR ----------
generate_graphs=False
num_graphs=23
graph_type=random_geometric
coverage_probability=0.25
param_sweep=False
# ---------- erdos renyi graphs ----------
erdos_prob=0.10
# ---------- random geo graphs ----------
geo_radius = 0.25
# ---------- watts-strogatz graphs ----------
ws_beta = 0.1
ws_k=18

# ---------- CUSTOM ANALYSIS SETTINGS ----------
# plot the best response output on all analysis graphs
best_response_gt=False
# NOTE: True values trigger custom running configurations
analyze_system=False
# numer of system configurations to test for analyze system
num_systems=1
analyze_beta=False
analyze_temperature=False
find_optimal_iterations=True
# Pass comma separated list of systems to load
load_from_config=True
system_file_directory=app/out/saved_models/rand_geo_small
output_dir="app/out/rand_geo_small_opt_iteration"