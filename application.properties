[DEFAULT]
# ---------- SYSTEM INITIALIZATION PARAMETERS ----------
num_trials=2
iterations_per_trial=1000
num_resources=10
num_agents=5
max_cover=2
resource_val_lb=5
resource_val_ub=30
agent_action_len_lb=3
agent_action_len_ub=4
agent_subset_len_lb=3
agent_subset_len_ub=5
load_from_config=False
algorithm=probability_response
# passing a comma separated list of distribution names will run all sequentially
distribution=logit_response
system_convergence_iter=500
batch_wake_up=10

# ---------- APPROXIMATE BEST RESPONSE PARAMETERS ----------
beta=0.5

# ---------- LOGIT RESPONSE PARAMETERS ----------
temperature=1.0

# ---------- GENETIC PARAMETERS ----------
population_size = 10000
mutation_rate = 0.33
tournament_k = 1000
num_parents = 2
generational_size = 0.95
k_crossover=1

# ---------- PARAMETER ANALYSIS SETTINGS ----------
trial_repetitions=5
# NOTE: True values trigger custom running configurations, only set one to True at a time
analyze_beta=False
analyze_temperature=False