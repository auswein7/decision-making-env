[DEFAULT]
# ---------- SYSTEM INITIALIZATION PARAMETERS ----------
num_trials=1
iterations_per_trial=100
num_resources=4
num_agents=2
max_cover=2
resource_val_lb=10
resource_val_ub=30
agent_action_len_lb=2
agent_action_len_ub=2
agent_subset_len_lb=2
agent_subset_len_ub=2
load_from_config=False
# passing a comma separated list of distribution names will run all sequentially
distribution=approximate_best_response
utility_functions=equal_share,marginal_contribution,optimistic
system_convergence_iter=1000

# ---------- APPROXIMATE BEST RESPONSE PARAMETERS ----------
beta=0.7

# ---------- LOGIT RESPONSE PARAMETERS ----------
temperature=0.001

# ---------- PARAMETER ANALYSIS SETTINGS ----------
trial_repetitions=3
# NOTE: True values trigger custom running configurations
analyze_beta=True
analyze_temperature=True