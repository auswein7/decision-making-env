[DEFAULT]
# ---------- SYSTEM INITIALIZATION PARAMETERS ----------
num_trials=1
iterations_per_trial=100000
num_resources=100
num_agents=15
max_cover=2
resource_val_lb=10
resource_val_ub=30
agent_action_len_lb=3
agent_action_len_ub=3
agent_subset_len_lb=4
agent_subset_len_ub=4
load_from_config=False
# passing a comma separated list of distribution names will run all sequentially
distribution=approximate_best_response
utility_function=equal_share
algorithm=probability_response
system_convergence_iter=1000

# ---------- APPROXIMATE BEST RESPONSE PARAMETERS ----------
beta=0.7

# ---------- LOGIT RESPONSE PARAMETERS ----------
temperature=0.001

# ---------- GENETIC PARAMETERS ----------
population_size = 10000
mutation_rate = 0.33
tournament_k = 1000
num_parents = 2
generational_size = 0.95
k_crossover=1

# ---------- PARAMETER ANALYSIS SETTINGS ----------
trial_repetitions=3
# NOTE: True values trigger custom running configurations
analyze_beta=True
analyze_temperature=True